# docker-compose.yml (repo ROOT)
# Day 2 version: this will add custom bridge network and persistent Azurite data volume.
# Still uses v1.0 images. Switched to v2.0 on Day 5.
# Attribution: adapted from the lecturer's Docker Compose notes (IIE, 2026);
# networks and volumes syntax from Docker (2026e; 2026g).
services:
  azurite:
    image: st10482062/coffeenchill-azurite:v1.0
    container_name: coffeenchill-azurite-compose
    command: azurite --skipApiVersionCheck --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table
    volumes:
      - azurite-data:/data
    networks:
      - coffeenchill-net

  functions:
    image: st10482062/coffeenchill-functions:v1.0
    container_name: coffeenchill-functions-compose
    ports:
      - "7071:80"
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      # "azurite" is the service name, not localhost.
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
    depends_on:
      - azurite
    networks:
      - coffeenchill-net

networks:
  coffeenchill-net:
    driver: bridge

volumes:
  azurite-data: