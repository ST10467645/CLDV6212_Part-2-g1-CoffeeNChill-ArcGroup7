# docker-compose.yml (repo ROOT)
# Starts Azurite and the Functions app together. Images are pulled from Docker Hub (no local build).
# Attribution: adapted from the lecturer's Docker Compose notes
# service structure, networks and volumes syntax from Docker (2026e; 2026f; 2026g).
services:
  azurite:
    image: st10482062/coffeenchill-azurite:v2.0
    container_name: coffeenchill-azurite-compose
    command: azurite --skipApiVersionCheck --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table
    volumes:
      - azurite-data:/data
    networks:
      - coffeenchill-net
    restart: unless-stopped

  functions:
    image: st10482062/coffeenchill-functions:v2.0
    container_name: coffeenchill-functions-compose
    ports:
      - "7071:80"
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      # "azurite" is the service name, not localhost. Inside a container localhost means the container itself.
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      STATUS_STEP_DELAY_SECONDS: "10"
      AUTO_ADVANCE_STATUS: "true"
      ENABLE_POISON_TEST: "false"
    depends_on:
      - azurite
    networks:
      - coffeenchill-net
    restart: unless-stopped

networks:
  coffeenchill-net:
    driver: bridge

volumes:
  azurite-data: